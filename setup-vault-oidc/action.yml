name: "Set up HashiCorp Vault with Devin OIDC"
description: "Configure the Vault CLI to authenticate via JWT/OIDC auth using Devin-issued OIDC tokens (exchanged with the devin-oidc CLI through a token helper). Use in the initialize section of your blueprint."
category: "Cloud Access"
inputs:
  vault-addr:
    description: "Vault server address (e.g. 'https://vault.corp.com:8200')"
    required: true
  role:
    description: "Vault role name configured in the JWT/OIDC auth method (its bound_audiences must include the audience claim)"
    required: true
  auth-mount:
    description: "Mount path of the JWT/OIDC auth method in Vault"
    required: false
    default: "jwt"
  audience:
    description: "Audience for the exchanged OIDC token; must match bound_audiences in the Vault role. Defaults to vault-addr."
    required: false
    default: ""
  subject-keys:
    description: "Space-delimited claim names composing the token's sub claim (for Vault bound_subject conditions)"
    required: false
    default: "org_id"
  vault-namespace:
    description: "Vault enterprise namespace (leave empty for non-enterprise or root namespace)"
    required: false
    default: ""
  install-vault:
    description: "Whether to install the Vault CLI (set to 'false' if already installed)"
    required: false
    default: "true"
  vault-version:
    description: "Vault CLI version to install (ignored if install-vault is 'false')"
    required: false
    default: "1.17.2"
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        IN_VAULT_ADDR: ${{ inputs.vault-addr }}
        IN_ROLE: ${{ inputs.role }}
        IN_AUTH_MOUNT: ${{ inputs.auth-mount }}
        IN_AUDIENCE: ${{ inputs.audience }}
        IN_SUBJECT_KEYS: ${{ inputs.subject-keys }}
        IN_VAULT_NAMESPACE: ${{ inputs.vault-namespace }}
        IN_INSTALL_VAULT: ${{ inputs.install-vault }}
        IN_VAULT_VERSION: ${{ inputs.vault-version }}
      run: |
        command -v node >/dev/null || { echo "::error::setup-vault-oidc needs node on PATH"; exit 1; }
        env \
          "INPUT_VAULT-ADDR=$IN_VAULT_ADDR" \
          "INPUT_ROLE=$IN_ROLE" \
          "INPUT_AUTH-MOUNT=$IN_AUTH_MOUNT" \
          "INPUT_AUDIENCE=$IN_AUDIENCE" \
          "INPUT_SUBJECT-KEYS=$IN_SUBJECT_KEYS" \
          "INPUT_VAULT-NAMESPACE=$IN_VAULT_NAMESPACE" \
          "INPUT_INSTALL-VAULT=$IN_INSTALL_VAULT" \
          "INPUT_VAULT-VERSION=$IN_VAULT_VERSION" \
          node "$GITHUB_ACTION_PATH/dist/index.js"
