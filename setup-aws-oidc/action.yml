name: "Set up AWS CLI with Devin OIDC"
description: "Configure the AWS CLI to authenticate via AssumeRoleWithWebIdentity using Devin-issued OIDC tokens (exchanged with the devin-oidc CLI through a credential_process helper). Use in the initialize section of your blueprint."
category: "Cloud Access"
inputs:
  role-arn:
    description: "ARN of the IAM role to assume (its trust policy must trust the Devin OIDC provider)"
    required: true
  region:
    description: "AWS region to set on the profile (e.g. 'us-east-1'). Leave empty to skip."
    required: false
    default: ""
  profile:
    description: "AWS profile name to configure"
    required: false
    default: "default"
  audience:
    description: "Audience for the exchanged OIDC token; must match the IdP's client ID (aud condition) in AWS IAM"
    required: false
    default: "sts.amazonaws.com"
  subject-keys:
    description: "Space-delimited claim names composing the token's sub claim (for IAM trust policy sub conditions)"
    required: false
    default: "org_id"
  session-name:
    description: "Role session name"
    required: false
    default: "devin"
  duration-seconds:
    description: "Duration of the assumed-role session in seconds"
    required: false
    default: "3600"
  cache-credentials:
    description: "Reuse temporary AWS credentials for this profile within a Linux Devin session"
    required: false
    default: "false"
  set-default-profile:
    description: "When 'profile' is not 'default', also configure [default] to use the same credential helper (skipped if [default] already exists)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        IN_ROLE_ARN: ${{ inputs.role-arn }}
        IN_REGION: ${{ inputs.region }}
        IN_PROFILE: ${{ inputs.profile }}
        IN_AUDIENCE: ${{ inputs.audience }}
        IN_SUBJECT_KEYS: ${{ inputs.subject-keys }}
        IN_SESSION_NAME: ${{ inputs.session-name }}
        IN_DURATION_SECONDS: ${{ inputs.duration-seconds }}
        IN_CACHE_CREDENTIALS: ${{ inputs.cache-credentials }}
        IN_SET_DEFAULT_PROFILE: ${{ inputs.set-default-profile }}
      run: |
        command -v node >/dev/null || { echo "::error::setup-aws-oidc needs node on PATH"; exit 1; }
        env \
          "INPUT_ROLE-ARN=$IN_ROLE_ARN" \
          "INPUT_REGION=$IN_REGION" \
          "INPUT_PROFILE=$IN_PROFILE" \
          "INPUT_AUDIENCE=$IN_AUDIENCE" \
          "INPUT_SUBJECT-KEYS=$IN_SUBJECT_KEYS" \
          "INPUT_SESSION-NAME=$IN_SESSION_NAME" \
          "INPUT_DURATION-SECONDS=$IN_DURATION_SECONDS" \
          "INPUT_CACHE-CREDENTIALS=$IN_CACHE_CREDENTIALS" \
          "INPUT_SET-DEFAULT-PROFILE=$IN_SET_DEFAULT_PROFILE" \
          node "$GITHUB_ACTION_PATH/dist/index.js"
