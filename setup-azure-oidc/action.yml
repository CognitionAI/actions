name: "Set up Azure CLI with Devin OIDC"
description: "Configure Azure CLI and Azure SDKs to authenticate via Microsoft Entra workload identity federation using Devin-issued OIDC tokens (exchanged with the devin-oidc CLI). Use in the initialize section of your blueprint."
category: "Cloud Access"
inputs:
  client-id:
    description: "Application (client) ID of the Entra app registration or user-assigned managed identity with a federated identity credential trusting Devin"
    required: true
  tenant-id:
    description: "Entra tenant ID"
    required: true
  subscription-id:
    description: "Default Azure subscription to select"
    required: false
    default: ""
  audience:
    description: "Audience for the exchanged OIDC token; must match the federated credential's audience"
    required: false
    default: "api://AzureADTokenExchange"
  subject-keys:
    description: "Space-delimited claim names composing the token's sub claim"
    required: false
    default: "org_id"
  install-azure-cli:
    description: "Whether to install the Azure CLI if it is absent"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        IN_CLIENT_ID: ${{ inputs.client-id }}
        IN_TENANT_ID: ${{ inputs.tenant-id }}
        IN_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        IN_AUDIENCE: ${{ inputs.audience }}
        IN_SUBJECT_KEYS: ${{ inputs.subject-keys }}
        IN_INSTALL_AZURE_CLI: ${{ inputs.install-azure-cli }}
      run: |
        command -v node >/dev/null || { echo "::error::setup-azure-oidc needs node on PATH"; exit 1; }
        env \
          "INPUT_CLIENT-ID=$IN_CLIENT_ID" \
          "INPUT_TENANT-ID=$IN_TENANT_ID" \
          "INPUT_SUBSCRIPTION-ID=$IN_SUBSCRIPTION_ID" \
          "INPUT_AUDIENCE=$IN_AUDIENCE" \
          "INPUT_SUBJECT-KEYS=$IN_SUBJECT_KEYS" \
          "INPUT_INSTALL-AZURE-CLI=$IN_INSTALL_AZURE_CLI" \
          node "$GITHUB_ACTION_PATH/dist/index.js"
