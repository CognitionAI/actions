name: "Set up JFrog CLI with Devin OIDC"
description: "Configure the JFrog CLI to authenticate via OIDC token exchange using Devin-issued OIDC tokens. Installs a jf wrapper that transparently refreshes credentials on 401. Use in the initialize section of your blueprint."
category: "Cloud Access"
inputs:
  jfrog-url:
    description: "JFrog Platform URL (e.g. 'https://mycompany.jfrog.io')"
    required: true
  provider-name:
    description: "OIDC provider name configured in JFrog Platform (must match the integration name)"
    required: true
  audience:
    description: "Audience for the exchanged OIDC token; must match the JFrog OIDC integration's audience. Defaults to jfrog-url."
    required: false
    default: ""
  subject-keys:
    description: "Space-delimited claim names composing the token's sub claim"
    required: false
    default: "org_id"
  server-id:
    description: "JFrog CLI server configuration ID"
    required: false
    default: "default"
  install-jfrog-cli:
    description: "Whether to install the JFrog CLI (set to 'false' if already installed)"
    required: false
    default: "true"
  jfrog-cli-version:
    description: "JFrog CLI version to install (ignored if install-jfrog-cli is 'false')"
    required: false
    default: "2.72.2"
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        IN_JFROG_URL: ${{ inputs.jfrog-url }}
        IN_PROVIDER_NAME: ${{ inputs.provider-name }}
        IN_AUDIENCE: ${{ inputs.audience }}
        IN_SUBJECT_KEYS: ${{ inputs.subject-keys }}
        IN_SERVER_ID: ${{ inputs.server-id }}
        IN_INSTALL_JFROG_CLI: ${{ inputs.install-jfrog-cli }}
        IN_JFROG_CLI_VERSION: ${{ inputs.jfrog-cli-version }}
      run: |
        command -v node >/dev/null || { echo "::error::setup-jfrog-oidc needs node on PATH"; exit 1; }
        env \
          "INPUT_JFROG-URL=$IN_JFROG_URL" \
          "INPUT_PROVIDER-NAME=$IN_PROVIDER_NAME" \
          "INPUT_AUDIENCE=$IN_AUDIENCE" \
          "INPUT_SUBJECT-KEYS=$IN_SUBJECT_KEYS" \
          "INPUT_SERVER-ID=$IN_SERVER_ID" \
          "INPUT_INSTALL-JFROG-CLI=$IN_INSTALL_JFROG_CLI" \
          "INPUT_JFROG-CLI-VERSION=$IN_JFROG_CLI_VERSION" \
          node "$GITHUB_ACTION_PATH/dist/index.js"
