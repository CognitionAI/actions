name: "Set up NVIDIA driver"
description: "Install a pinned NVIDIA driver on a Devin VM. With an NVIDIA GPU, wait until nvidia-smi answers, so the snapshot is taken with the driver bound; without one, install only. Linux and Windows. Use in the initialize section of your blueprint."
category: "GPU"
inputs:
  version:
    description: "Driver version, one of the versions pinned for the VM's platform (Windows: 596.86, Linux: 580). Quote the value. Empty installs the platform's default."
    required: false
    default: ""
  timeout-seconds:
    description: "How long to wait for nvidia-smi to answer after the install"
    required: false
    default: "600"
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        IN_VERSION: ${{ inputs.version }}
        IN_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        command -v node >/dev/null || { echo "::error::setup-nvidia-driver needs node on PATH"; exit 1; }
        env \
          "INPUT_VERSION=$IN_VERSION" \
          "INPUT_TIMEOUT-SECONDS=$IN_TIMEOUT_SECONDS" \
          node "$GITHUB_ACTION_PATH/dist/index.js"
